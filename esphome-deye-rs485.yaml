            return atof(s.substr(p, e - p).c_str());
  - platform: template
    name: L1 Power
    unit_of_measurement: W
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_isv).state;

            int p = s.find("\"p\":");
            if (p == std::string::npos)
              return NAN;

