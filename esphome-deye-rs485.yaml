esphome:
  name: esphome-deye-rs485
  friendly_name: ESPHome Deye RS485

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

sensor:
  - platform: uptime
    name: "Deye Meter Uptime"
  - platform: wifi_signal
    name: "Deye Meter WiFi"
    update_interval: 60s
  - platform: mqtt_subscribe
    name: "Grid Frequency"
    topic: "go-eCharger/XXXXXX/fhz"
    unit_of_measurement: "Hz"
  - platform: template
    name: Grid Power Parsed
    unit_of_measurement: W
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      std::string s = id(goe_ccp).state;

            int pos1 = s.find(',');
            if (pos1 == std::string::npos) return NAN;

            int pos2 = s.find(',', pos1 + 1);
            if (pos2 == std::string::npos) return NAN;

            std::string grid = s.substr(pos1 + 1, pos2 - pos1 - 1);

            return atof(grid.c_str());
  - platform: template
    name: L1 Voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_usv).state;

            int p = s.find("\"u1\":");
            if (p == std::string::npos) return NAN;

            p += 5;
            int e = s.find(",", p);

            return atof(s.substr(p, e - p).c_str());
  - platform: template
    name: L2 Voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_usv).state;

            int p = s.find("\"u2\":");
            if (p == std::string::npos) return NAN;

            p += 5;
            int e = s.find(",", p);

            return atof(s.substr(p, e - p).c_str());    
  - platform: template
    name: L3 Voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_usv).state;

            int p = s.find("\"u3\":");
            if (p == std::string::npos) return NAN;

            p += 5;
            int e = s.find(",", p);

            return atof(s.substr(p, e - p).c_str());
  - platform: template
    name: Grid Import Total
    unit_of_measurement: kWh
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_cec).state;

            int first_close = s.find("],[");
            if (first_close == std::string::npos) return NAN;

            int start = first_close + 3;

            int comma = s.find(",", start);
            if (comma == std::string::npos) return NAN;

            std::string value = s.substr(start, comma - start);

            return atof(value.c_str()) / 1000.0;
  - platform: template
    name: Grid Export Total
    unit_of_measurement: kWh
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_cec).state;

            int first_close = s.find("],[");
            if (first_close == std::string::npos) return NAN;

            int start = first_close + 3;

            int comma1 = s.find(",", start);
            if (comma1 == std::string::npos) return NAN;

            int end = s.find("]", comma1);
            if (end == std::string::npos) return NAN;

            std::string value = s.substr(comma1 + 1, end - comma1 - 1);

            return atof(value.c_str()) / 1000.0;
  - platform: template
    name: Home Power
    unit_of_measurement: W
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_ccp).state;

            int start = 1;  // after '['
            int comma = s.find(",", start);

            if (comma == std::string::npos)
              return NAN;

            return atof(s.substr(start, comma - start).c_str());
  - platform: template
    name: Car Power
    unit_of_measurement: W
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_ccp).state;

            int p1 = s.find(",");
            int p2 = s.find(",", p1 + 1);
            int p3 = s.find(",", p2 + 1);

            if (p1 == std::string::npos ||
                p2 == std::string::npos ||
                p3 == std::string::npos)
              return NAN;

            std::string value = s.substr(p2 + 1, p3 - p2 - 1);

            if (value == "null")
              return 0;

            return atof(value.c_str());
  - platform: template
    name: Solar Power
    unit_of_measurement: W
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_ccp).state;

            int p1 = s.find(",");
            int p2 = s.find(",", p1 + 1);
            int p3 = s.find(",", p2 + 1);
            int p4 = s.find(",", p3 + 1);
            int p5 = s.find(",", p4 + 1);

            if (p1 == std::string::npos ||
                p2 == std::string::npos ||
                p3 == std::string::npos ||
                p4 == std::string::npos ||
                p5 == std::string::npos)
              return NAN;

            std::string value = s.substr(p4 + 1, p5 - p4 - 1);

            if (value == "null")
              return 0;

            return atof(value.c_str());
  - platform: template
    name: L1 Current
    unit_of_measurement: A
    accuracy_decimals: 2
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_isv).state;

            int p = s.find("\"i\":");
            if (p == std::string::npos)
              return NAN;

            p += 4;

            int e = s.find(",", p);
            if (e == std::string::npos)
              return NAN;

            return atof(s.substr(p, e - p).c_str());
  - platform: template
    name: L2 Current
    unit_of_measurement: A
