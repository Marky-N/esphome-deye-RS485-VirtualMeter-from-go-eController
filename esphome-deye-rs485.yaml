  - platform: template
    name: L2 Power
    unit_of_measurement: W
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_isv).state;

            int p = s.find("\"p\":");
            if (p == std::string::npos)
              return NAN;

            p = s.find("\"p\":", p + 1);
