            return atof(s.substr(p, e - p).c_str());
  - platform: template
    name: L3 Power
    unit_of_measurement: W
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
            std::string s = id(goe_isv).state;

            int p = s.find("\"p\":");
            if (p == std::string::npos)
              return NAN;

            p = s.find("\"p\":", p + 1);
            if (p == std::string::npos)
              return NAN;

            p = s.find("\"p\":", p + 1);
            if (p == std::string::npos)
              return NAN;

            p += 4;

            int e = s.find(",", p);
            if (e == std::string::npos)
              return NAN;

            return atof(s.substr(p, e - p).c_str());    
